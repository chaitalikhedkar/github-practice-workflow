
<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        .login {
            background: white;
            padding: 30px;
            margin: 100px auto;
            width: 250px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            background: blue;
            color: white;
            padding: 10px 30px;
            border: none;
        }
    </style>
</head>
<body>

<div class="login">
    <h2>Login </h2>

    <input type="text" placeholder="Username"><br>

    <input type="password" placeholder="Password"><br>

    <button onclick="alert('Login Successful!')">
        Login
    </button>
</div>

</body>
</html>
